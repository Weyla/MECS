esphome:
  name: mio-master
  friendly_name: MIO Expansion Master
  includes:
    - mio_components/mio_sources/mio.c
    - mio_components/mio_sources/mio_io.c
    - mio_components/mio_sources/mio_io_wire.c
    - mio_components/mio_sources/mio_command.c
    - mio_components/mio_sources/mio_client.c
    - mio_components/mio_sources/mio.h
    - mio_components/mio_sources/mio_io.h
    - mio_components/mio_sources/mio_command.h
    - mio_components/mio_sources/mio_client.h

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: mio_components

canbus:
  - platform: esp32_can
    id: mio_can
    can_id: 0
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

mio_expansion:
  canbus_id: mio_can
  inputs:
    - name: "DI4 input 1"
      node: 2
      channel: 0
  outputs:
    - name: "DO4 output 1"
      node: 1
      channel: 0
