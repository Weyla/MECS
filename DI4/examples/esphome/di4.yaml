# Example master using the GitHub-hosted ESPHome MECS component.
# DI4 remote channels map to GPIO0..3; CAN on the master uses GPIO4/5.
# The DI4 firmware defaults to active-low, pull-up, stable debounce (20 ms),
# and reports both periodically and on change (100 ms).
# Supported DI4 settings: polarity high/low; filter none/stable/PWM;
# debounce 1..1000 ms; pull floating/up/down; reporting periodic/change/both;
# report interval 20..500 ms. PWM capture is local to the DI4 node.
# The current ESPHome adapter maps input states only; per-channel filter and
# polarity controls are not yet exposed as ESPHome entities/actions.

esphome:
  name: mecs-di4-master
  friendly_name: MECS DI4 Input Example
  includes:
    - mecs_components/mecs_sources/mecs_protocol.c
    - mecs_components/mecs_sources/mecs_io.c
    - mecs_components/mecs_sources/mecs_io_wire.c
    - mecs_components/mecs_sources/mecs_client.c
    - mecs_components/mecs_sources/mecs_protocol.h
    - mecs_components/mecs_sources/mecs_io.h
    - mecs_components/mecs_sources/mecs_client.h

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/Weyla/MECS.git
      ref: main
      path: SHARED/adapters/esphome

canbus:
  - platform: esp32_can
    id: mecs_can
    can_id: 0
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

mecs_expansion:
  canbus_id: mecs_can
  inputs:
    - name: "DI4 input 0 / GPIO0"
      node: 2
      channel: 0
    - name: "DI4 input 1 / GPIO1"
      node: 2
      channel: 1
    - name: "DI4 input 2 / GPIO2"
      node: 2
      channel: 2
    - name: "DI4 input 3 / GPIO3"
      node: 2
      channel: 3
