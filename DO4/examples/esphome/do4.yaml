# Example master using the GitHub-hosted ESPHome MIO component.
# DO4 remote channels map to GPIO0..3; CAN on the master uses GPIO4/5.
# Settings supported by the node: active-high/low; digital/PWM/timed-pulse/
# slow-PWM modes; frequency 10..10000 Hz; duty 0..100% at 0.01% resolution;
# pulse 10..60000 ms; slow period 0.1..3600.0 seconds; individual on/off gate.
# All outputs start inactive and return inactive when the heartbeat expires.
# The current ESPHome adapter exposes switch entities only; advanced runtime
# settings are not exposed by this adapter yet.

esphome:
  name: mio-do4-master
  friendly_name: MIO DO4 Output Example
  includes:
    - mio_components/mio_sources/mio.c
    - mio_components/mio_sources/mio_io.c
    - mio_components/mio_sources/mio_io_wire.c
    - mio_components/mio_sources/mio_command.c
    - mio_components/mio_sources/mio_client.c
    - mio_components/mio_sources/mio.h
    - mio_components/mio_sources/mio_io.h
    - mio_components/mio_sources/mio_command.h
    - mio_components/mio_sources/mio_client.h

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/Weyla/MECS.git
      ref: main
      path: SHARED/adapters/esphome

canbus:
  - platform: esp32_can
    id: mio_can
    can_id: 0
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

mio_expansion:
  canbus_id: mio_can
  outputs:
    - name: "DO4 output 0 / GPIO0"
      node: 1
      channel: 0
    - name: "DO4 output 1 / GPIO1"
      node: 1
      channel: 1
    - name: "DO4 output 2 / GPIO2"
      node: 1
      channel: 2
    - name: "DO4 output 3 / GPIO3"
      node: 1
      channel: 3
