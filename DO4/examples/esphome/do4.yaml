# Example master using the GitHub-hosted ESPHome MECS component.
# DO4 remote channels map to GPIO0..3; CAN on the master uses GPIO4/5.
# Settings supported by the node: active-high/low; digital/PWM/timed-pulse/
# slow-PWM modes; frequency 10..10000 Hz; duty 0..100% at 0.01% resolution;
# pulse 10..60000 ms; slow period 0.1..3600.0 seconds; individual on/off gate.
# All outputs start inactive and return inactive when the heartbeat expires.
# The current ESPHome adapter exposes switch entities only; advanced runtime
# settings are not exposed by this adapter yet.

esphome:
  name: mecs-do4-master
  friendly_name: MECS DO4 Output Example
  includes:
    - mecs_components/mecs_sources/mecs_protocol.c
    - mecs_components/mecs_sources/mecs_io.c
    - mecs_components/mecs_sources/mecs_io_wire.c
    - mecs_components/mecs_sources/mecs_client.c
    - mecs_components/mecs_sources/mecs_protocol.h
    - mecs_components/mecs_sources/mecs_io.h
    - mecs_components/mecs_sources/mecs_client.h

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/Weyla/MECS.git
      ref: main
      path: SHARED/adapters/esphome

canbus:
  - platform: esp32_can
    id: mecs_can
    can_id: 0
    tx_pin: GPIO4
    rx_pin: GPIO5
    bit_rate: 500kbps

mecs_expansion:
  canbus_id: mecs_can
  outputs:
    - name: "DO4 output 0 / GPIO0"
      node: 1
      channel: 0
    - name: "DO4 output 1 / GPIO1"
      node: 1
      channel: 1
    - name: "DO4 output 2 / GPIO2"
      node: 1
      channel: 2
    - name: "DO4 output 3 / GPIO3"
      node: 1
      channel: 3
