name: Firmware and portable checks

on:
  push:
  pull_request:

jobs:
  portable:
    name: Portable and CAN adapter regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S SHARED/tests -B /tmp/mecs-build
      - run: cmake --build /tmp/mecs-build --parallel
      - run: ctest --test-dir /tmp/mecs-build --output-on-failure

  firmware:
    name: ${{ matrix.project }} (ESP-IDF 5.5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [MASTER, DO4, DI4]
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        run: |
          docker run --rm \
            -e HOME=/tmp \
            -e IDF_GIT_SAFE_DIR=/project \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            espressif/idf:v5.5 \
            idf.py -C "${{ matrix.project }}" build
